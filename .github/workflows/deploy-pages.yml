name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project Pages: /<repo>/ . Override for a user/org site with:
          #   VITE_BASE=/ npm run build
          # or change this env in the workflow / a repo variable.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Échec du build : le secret GitHub « VITE_GOOGLE_CLIENT_ID » est vide ou absent. Ajoutez-le dans Paramètres → Secrets and variables → Actions, puis relancez le workflow (voir README)."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_API_KEY" ]; then
            echo "::error::Échec du build : le secret GitHub « VITE_GOOGLE_API_KEY » est vide ou absent. Ajoutez-le dans Paramètres → Secrets and variables → Actions, puis relancez le workflow (voir README)."
            exit 1
          fi
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
